name: Order a research brief
description: Send one business question. Get a PDF brief with sources in 24 hours.
title: "Brief: "
labels: ["order"]
body:
  - type: markdown
    attributes:
      value: |
        This form is public. Do not write secret or personal data.
        Pilot week: the first 5 briefs are free.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: One business question. Name the place, the time and what you will decide with the answer.
      placeholder: "Example: Which suppliers of recycled packaging ship to Bulgaria, and what is their minimum order?"
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language of the brief
      placeholder: English
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: My question is not legal, medical or investment advice, and not homework.
          required: true
